version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tabletap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabletap
      POSTGRES_USER: tabletap_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabletap_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tabletap_user -d tabletap" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for session / pub-sub) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tabletap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tabletap-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tabletap_user:${POSTGRES_PASSWORD:-tabletap_secret}@postgres:5432/tabletap
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend (Customer App) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tabletap-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ─── Admin Dashboard ───────────────────────────────────────────────────────
  admin:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: tabletap-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3001:3001"
    depends_on:
      - backend

  # ─── Kitchen Display ───────────────────────────────────────────────────────
  kitchen:
    build:
      context: ./kitchen-display
      dockerfile: Dockerfile
    container_name: tabletap-kitchen
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3002:3002"
    depends_on:
      - backend

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tabletap-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - admin
      - kitchen

volumes:
  postgres_data:
