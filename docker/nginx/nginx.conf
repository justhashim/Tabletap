events {
  worker_connections 1024;
}

http {
  upstream backend   { server backend:4000; }
  upstream frontend  { server frontend:3000; }
  upstream admin     { server admin:3001; }
  upstream kitchen   { server kitchen:3002; }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # ─── API ──────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name api.tabletap.com;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ─── Customer App ─────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name tabletap.com www.tabletap.com;

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ─── Admin Dashboard ──────────────────────────────────────────────────────
  server {
    listen 80;
    server_name admin.tabletap.com;

    location / {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ─── Kitchen Display ──────────────────────────────────────────────────────
  server {
    listen 80;
    server_name kitchen.tabletap.com;

    location / {
      proxy_pass http://kitchen;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
